# ---- Evening automation — at-home mode ----------------------
# Close common-area shutters 25 min after sunset when someone is home,
# in two stages: first to 80% (kitchen_door to 60%), held for 1h, then
# fully closed to 100%.
# Bedroom, children's rooms, bathroom, office, and WC are intentionally
# excluded — personal spaces are not auto-closed when at home.

define always_on_evening at *{sunset("REAL")} {\
	if ((ReadingsVal("SCN_Away", "state", "off")) eq "off") {\
		{Log 3, "automation-LOG: always_on eve active."}\
		{fhem("define a1 at +00:25:00 set SHU_F2_hall g1 80")}\
		{fhem("define a2 at +00:25:14 set SHU_F1_kitchen_window g1 80")}\
		{fhem("define a3 at +00:25:16 set SHU_F1_kitchen_door g1 60")}\
		{fhem("define a4 at +00:25:18 set SHU_F1_diningroom g1 80")}\
		{fhem("define a5 at +00:25:20 set SHU_F1_livingroom g1 80")}\
		{fhem("define a6 at +00:25:21 set SHU_F0_C1 g1 80")}\
		{fhem("define a7 at +00:25:22 set SHU_F0_C3 g1 80")}\
		{fhem("define a8 at +01:25:00 set SHU_F2_hall g1 100")}\
		{fhem("define a9 at +01:25:14 set SHU_F1_kitchen_window g1 100")}\
		{fhem("define a10 at +01:25:16 set SHU_F1_kitchen_door g1 100")}\
		{fhem("define a11 at +01:25:18 set SHU_F1_diningroom g1 100")}\
		{fhem("define a12 at +01:25:20 set SHU_F1_livingroom g1 100")}\
		{fhem("define a13 at +01:25:21 set SHU_F0_C1 g1 100")}\
		{fhem("define a14 at +01:25:22 set SHU_F0_C3 g1 100")}\
	} else {\
		{Log 3, "automation-LOG: always_on eve inactive."}\
	}\
}
attr always_on_evening room 3_Central
attr always_on_evening group Automation
attr always_on_evening alias Evening

# ---- Shutter position preset (per floor) ----------------------
# PosPreset_F0/F1/F2 (device_config.cfg) each show 4 buttons (20/40/60/80).
# Picking one rewrites the "Pos" value inside that floor's shutters'
# eventMap, so the next press of any of their own Pos buttons uses it.
# Up/Stop/Down mappings in the same eventMap attribute are left untouched.
# One statement per notify (no top-level ";") to avoid FHEM's chain-command
# splitting on inline semicolons - same style as the automations above.

define PosPresetApply_F0 notify PosPreset_F0 {fhem("attr $_ eventMap ".(AttrVal($_,"eventMap","")=~s/g1 \d+:Pos/g1 $EVTPART0:Pos/r)) for ("SHU_F0_C1","SHU_F0_C3")}

define PosPresetApply_F1 notify PosPreset_F1 {fhem("attr $_ eventMap ".(AttrVal($_,"eventMap","")=~s/g1 \d+:Pos/g1 $EVTPART0:Pos/r)) for ("SHU_F1_kitchen_door","SHU_F1_kitchen_window","SHU_F1_diningroom","SHU_F1_livingroom","SHU_F1_office","SHU_F1_wc")}

define PosPresetApply_F2 notify PosPreset_F2 {fhem("attr $_ eventMap ".(AttrVal($_,"eventMap","")=~s/g1 \d+:Pos/g1 $EVTPART0:Pos/r)) for ("SHU_F2_hall","SHU_F2_bathroom","SHU_F2_hannah","SHU_F2_nicolas","SHU_F2_bedroom")}

# Default all three floor presets to 40% on every startup (incl. power
# cycles) - fires after FHEM has fully initialized (including statefile
# restore), so this is always the final word rather than depending on
# whatever a possibly-stale statefile last saved. Also re-syncs each
# floor's shutters' eventMap via PosPresetApply_F0/F1/F2 above.
define PosPresetDefault notify global:INITIALIZED {fhem("set $_ 40") for ("PosPreset_F0","PosPreset_F1","PosPreset_F2")}
