##############################################################
# FHEM scene and automation configuration
#
# Four automations:
#   training          — 09:25, at-home only: daily routine marker
#   automation_morn   — 09:30, away only:    morning shutter sequence (2 phases)
#   automation_eve    — sunset, away only:   presence simulation (lights + shutters)
#   always_on_eve     — sunset, at-home:     close shutters 25 min after sunset
#
# Shutter position: g1 N where N = 0 (fully open/up) to 100 (fully closed/down)
#
# `fhem("define eN at +HH:MM:SS cmd")` schedules a one-shot command relative to now.
# Each call creates a temporary at-timer device (e1, e2 … mN, aN) that fires once.
# On the next automation run the same device names are redefined, replacing the old timers.
#
# FIX (2026-09-11): Changed all +00:00:00 delays to +00:00:01 to prevent
# "Cowardly refusing to start a busy loop" errors. FHEM rejects zero-delay
# at-timers as a safety guard against infinite recursion.
#
# RANDOM JITTER (away_morning, away_evening): offsets are no longer literal
# +HH:MM:SS strings. Each automation groups its timers into narrative
# "beats" (e.g. "cooking", "dinner"); a beat's anchor time is the previous
# beat's anchor plus a randomized gap (`int(rand(...))`, drawn fresh each
# time the automation fires), while every timer *within* a beat keeps a
# fixed offset from that beat's anchor. A local `$fmt` closure turns the
# resulting second-count into the "+HH:MM:SS" string `at` needs. Because
# only inter-beat gaps are randomized and intra-beat spacing is fixed,
# invariants that depend on fixed ordering (e.g. a room's shutter reaching
# >=90% before its light turns on) hold no matter what is drawn.
##############################################################

# ---- Morning routine marker — at-home mode ------------------
# Placeholder for a daily at-home action (e.g. office light/shutter).
# Currently logs only. Add device commands inside the active branch as needed.

define training at *09:25 {\
	if ((ReadingsVal("SCN_Away", "state", "off")) eq "off") {\
		{Log 3, "automation-LOG: training active."}\
	} else {\
		{Log 3, "automation-LOG: training inactive."}\
	}\
}
attr training room 3_Central
attr training group Automation

# ---- Morning automation — away mode -------------------------
# Simulates occupancy by opening shutters in two phases. Randomized daily
# (see RANDOM JITTER note above) so the exact wake time and pacing differ
# from one morning to the next.
#
# Phase 1 (~24-33 min, randomized): a realistic wake-up order rather than
# everything at once — parents up first (bedroom, then bathroom, then the
# landing), then the kids are woken, then downstairs opens up room by
# room as the household moves through breakfast towards the workday.
#   OG: bedroom 50% -> bathroom 80% -> hall 50% -> hannah 80% -> nicolas 50%
#   EG: wc 0% -> kitchen_window 90% (near-closed for privacy) ->
#       kitchen_door 0% -> dining 0% -> living 0% -> office 0%
#
# Phase 2 (+2h56 to +3h04, randomized): adjust for afternoon sun
#   OG: hall 80%, bedroom 80%, bathroom 50%, hannah 50%, nicolas 80%
#   EG: kitchen_door 80%, dining 80%, living 80%

define away_morning at *09:30 {\
	if ((ReadingsVal("SCN_Away", "state", "off")) eq "on") {\
		{Log 3, "automation-LOG: morn active."}\
		{\
			my $fmt = sub { my $s = shift;; sprintf("+%02d:%02d:%02d", int($s/3600), int($s/60)%60, $s%60) };;\
			my $bedroom = 20 + int(rand(131));;\
			my $bathroom = $bedroom + 185;;\
			my $hall = $bedroom + 340;;\
			my $hannah = $hall + 275 + int(rand(241));;\
			my $nicolas = $hannah + 150;;\
			my $wc = $nicolas + 70 + int(rand(181));;\
			my $kitchen_window = $wc + 125;;\
			my $kitchen_door = $wc + 225;;\
			my $dining = $wc + 335;;\
			my $living = $wc + 490;;\
			my $office = $wc + 590;;\
			my $p2 = 10800 + int(rand(481)) - 240;;\
			fhem("define e1 at ".$fmt->($bedroom)." set SHU_F2_bedroom g1 50");;\
			fhem("define e2 at ".$fmt->($bathroom)." set SHU_F2_bathroom g1 80");;\
			fhem("define e3 at ".$fmt->($hall)." set SHU_F2_hall g1 50");;\
			fhem("define e4 at ".$fmt->($hannah)." set SHU_F2_hannah g1 80");;\
			fhem("define e5 at ".$fmt->($nicolas)." set SHU_F2_nicolas g1 50");;\
			fhem("define e6 at ".$fmt->($wc)." set SHU_F1_wc g1 0");;\
			fhem("define e7 at ".$fmt->($kitchen_window)." set SHU_F1_kitchen_window g1 90");;\
			fhem("define e8 at ".$fmt->($kitchen_door)." set SHU_F1_kitchen_door g1 0");;\
			fhem("define e9 at ".$fmt->($dining)." set SHU_F1_diningroom g1 0");;\
			fhem("define e10 at ".$fmt->($living)." set SHU_F1_livingroom g1 0");;\
			fhem("define e11 at ".$fmt->($office)." set SHU_F1_office g1 0");;\
			fhem("define e12 at ".$fmt->($p2)." set SHU_F2_hall g1 80");;\
			fhem("define e13 at ".$fmt->($p2+2)." set SHU_F2_bedroom g1 80");;\
			fhem("define e14 at ".$fmt->($p2+4)." set SHU_F2_bathroom g1 50");;\
			fhem("define e15 at ".$fmt->($p2+6)." set SHU_F2_hannah g1 50");;\
			fhem("define e16 at ".$fmt->($p2+8)." set SHU_F2_nicolas g1 80");;\
			fhem("define e17 at ".$fmt->($p2+16)." set SHU_F1_kitchen_door g1 80");;\
			fhem("define e18 at ".$fmt->($p2+18)." set SHU_F1_diningroom g1 80");;\
			fhem("define e19 at ".$fmt->($p2+20)." set SHU_F1_livingroom g1 80");;\
		}\
	} else {\
		{Log 3, "automation-LOG: morn inactive."}\
	}\
}
attr away_morning room 3_Central
attr away_morning group Presence Simulation Scenes
attr away_morning alias Morning

# ---- Evening automation — away mode -------------------------
# Manual test trigger (fires now instead of waiting for real sunset):
#   set SCN_Away on
#   set away_evening modifyTimeToTrigger +00:00:05
# Runs the away branch in ~5s using the already-defined command; the
# *{sunset("REAL")} recurrence re-arms itself for the next real sunset
# afterward. Remember to `set SCN_Away off` again once done testing.
#
# Simulates occupancy with a realistic household evening: arrival at dusk,
# cooking while the kids play in their rooms, a downstairs toilet break,
# family dinner, living-room TV, kids' bath/bedtime routine, then the
# parents' own bedtime. Runs ~1h45-2h45 from sunset to lights-out
# (randomized daily, see RANDOM JITTER note above).
#
# Shutter rule: a room's shutter is always brought to >=90% closed
# *before or at* the moment that room's light first turns on — an
# illuminated room behind a fully open shutter is an obvious "nobody's
# home" tell to an outside observer. Shutters may close further to 100%
# afterward once the room is done for the night. This is issued
# explicitly per room rather than relying on away_morning's carried-over
# position, since that automation may not have run (e.g. right after a
# startup default). This ordering is fixed (intra-beat), so it holds
# regardless of the random inter-beat gaps below.
#
# Beats (each anchor = previous beat's anchor + a randomized gap; offsets
# within a beat are fixed deltas from its anchor):
#   beat1  arrival: outside/hall lights, cellar C1/C3 fully close, and
#          (kept relative to arrival) porch light auto-off after ~45min
#   beat2  cooking: kitchen shutters ->90% before kitchen light;
#          hannah/nicolas play in their rooms, shutters ->90% first;
#          downstairs wc break; office/wc/F2 hall shutters close fully
#          since unused the rest of the evening
#   beat3  dinner: dining shutter ->90% before light, ->100% once seated;
#          kitchen/dining lights off after cleanup
#   beat4  living-room TV: shutter ->90% before light, ->100% once
#          settled; first bathroom/shower use (shutter ->90% first)
#   beat5  kids' bedtime: teeth brushing, bathroom/hannah/nicolas
#          shutters fully close, bedtime-story lights off
#   beat6  parents' bedtime: final bathroom stop, bedroom shutter ->90%
#          before light, ->100% once settled, lights out
#
# Note: offsets are intentionally irregular (e.g. +00:01:42 not +00:02:00) so
# the presence simulation does not look mechanical from the outside.

define away_evening at *{sunset("REAL")} {\
	if ((ReadingsVal("SCN_Away", "state", "off")) eq "on") {\
		{Log 3, "automation-LOG: eve active."}\
		{\
			my $fmt = sub { my $s = shift;; sprintf("+%02d:%02d:%02d", int($s/3600), int($s/60)%60, $s%60) };;\
			my $beat1 = 10 + int(rand(36));;\
			my $beat2 = $beat1 + 50 + int(rand(121));;\
			my $beat3 = $beat2 + 1050 + int(rand(601));;\
			my $beat4 = $beat3 + 1840 + int(rand(961));;\
			my $beat5 = $beat4 + 1155 + int(rand(721));;\
			my $beat6 = $beat5 + 1830 + int(rand(721));;\
			fhem("define m1 at ".$fmt->($beat1+0)." set LGT_F1_outside on");;\
			fhem("define m2 at ".$fmt->($beat1+7)." set LGT_F1_hall_door on");;\
			fhem("define m3 at ".$fmt->($beat1+10)." set SHU_F0_C1 g1 100");;\
			fhem("define m4 at ".$fmt->($beat1+12)." set SHU_F0_C3 g1 100");;\
			fhem("define m5 at ".$fmt->($beat1+20)." set LGT_F1_hall_stairs on");;\
			fhem("define m6 at ".$fmt->($beat1+85)." set LGT_F1_hall_stairs off");;\
			fhem("define m7 at ".$fmt->($beat2+0)." set SHU_F1_kitchen_window g1 90");;\
			fhem("define m8 at ".$fmt->($beat2+3)." set SHU_F1_kitchen_door g1 90");;\
			fhem("define m9 at ".$fmt->($beat1+115)." set LGT_F1_hall_door off");;\
			fhem("define m10 at ".$fmt->($beat2+10)." set LGT_F1_kitchen on");;\
			fhem("define m11 at ".$fmt->($beat2+75)." set LGT_F1_kitchen_led on");;\
			fhem("define m12 at ".$fmt->($beat2+110)." set SHU_F2_hannah g1 90");;\
