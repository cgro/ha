##############################################################
# FHEM scene and automation configuration
#
# Four automations:
#   training          — 09:25, at-home only: daily routine marker
#   automation_morn   — 09:30, away only:    morning shutter sequence (2 phases)
#   automation_eve    — sunset, away only:   presence simulation (lights + shutters)
#   always_on_eve     — sunset, at-home:     close shutters 25 min after sunset
#
# Shutter position: g1 N where N = 0 (fully open/up) to 100 (fully closed/down)
#
# `fhem("define eN at +HH:MM:SS cmd")` schedules a one-shot command relative to now.
# Each call creates a temporary at-timer device (e1, e2 … mN, aN) that fires once.
# On the next automation run the same device names are redefined, replacing the old timers.
#
# FIX (2026-09-11): Changed all +00:00:00 delays to +00:00:01 to prevent
# "Cowardly refusing to start a busy loop" errors. FHEM rejects zero-delay
# at-timers as a safety guard against infinite recursion.
##############################################################

# ---- Morning routine marker — at-home mode ------------------
# Placeholder for a daily at-home action (e.g. office light/shutter).
# Currently logs only. Add device commands inside the active branch as needed.

define training at *09:25 {\
	if ((ReadingsVal("SCN_Away", "state", "off")) eq "off") {\
		{Log 3, "automation-LOG: training active."}\
	} else {\
		{Log 3, "automation-LOG: training inactive."}\
	}\
}
attr training room 3_Central
attr training group Automation

# ---- Morning automation — away mode -------------------------
# Simulates occupancy by opening shutters in two phases.
#
# Phase 1 (~28 min): a realistic wake-up order rather than everything at
# once — parents up first (bedroom, then bathroom, then the landing),
# then the kids are woken, then downstairs opens up room by room as the
# household moves through breakfast towards the start of the workday.
#   OG: bedroom 50% -> bathroom 80% -> hall 50% -> hannah 80% -> nicolas 50%
#   EG: wc 0% -> kitchen_window 90% (near-closed for privacy) ->
#       kitchen_door 0% -> dining 0% -> living 0% -> office 0%
#
# Phase 2 (+3h): adjust for afternoon sun
#   OG: hall 80%, bedroom 80%, bathroom 50%, hannah 50%, nicolas 80%
#   EG: kitchen_door 80%, dining 80%, living 80%

define away_morning at *09:30 {\
	if ((ReadingsVal("SCN_Away", "state", "off")) eq "on") {\
		{Log 3, "automation-LOG: morn active."}\
		{fhem("define e1 at +00:00:05 set SHU_F2_bedroom g1 50")}\
		{fhem("define e2 at +00:03:10 set SHU_F2_bathroom g1 80")}\
		{fhem("define e3 at +00:05:45 set SHU_F2_hall g1 50")}\
		{fhem("define e4 at +00:12:20 set SHU_F2_hannah g1 80")}\
		{fhem("define e5 at +00:14:50 set SHU_F2_nicolas g1 50")}\
		{fhem("define e6 at +00:17:30 set SHU_F1_wc g1 0")}\
		{fhem("define e7 at +00:19:35 set SHU_F1_kitchen_window g1 90")}\
		{fhem("define e8 at +00:21:15 set SHU_F1_kitchen_door g1 0")}\
		{fhem("define e9 at +00:23:05 set SHU_F1_diningroom g1 0")}\
		{fhem("define e10 at +00:25:40 set SHU_F1_livingroom g1 0")}\
		{fhem("define e11 at +00:27:20 set SHU_F1_office g1 0")}\
		{fhem("define e12 at +03:01:00 set SHU_F2_hall g1 80")}\
		{fhem("define e13 at +03:01:02 set SHU_F2_bedroom g1 80")}\
		{fhem("define e14 at +03:01:04 set SHU_F2_bathroom g1 50")}\
		{fhem("define e15 at +03:01:06 set SHU_F2_hannah g1 50")}\
		{fhem("define e16 at +03:01:08 set SHU_F2_nicolas g1 80")}\
		{fhem("define e17 at +03:01:16 set SHU_F1_kitchen_door g1 80")}\
		{fhem("define e18 at +03:01:18 set SHU_F1_diningroom g1 80")}\
		{fhem("define e19 at +03:01:20 set SHU_F1_livingroom g1 80")}\
	} else {\
		{Log 3, "automation-LOG: morn inactive."}\
	}\
}
attr away_morning room 3_Central
attr away_morning group Presence Simulation Scenes
attr away_morning alias Morning

# ---- Evening automation — away mode -------------------------
# Manual test trigger (fires now instead of waiting for real sunset):
#   set SCN_Away on
#   set away_evening modifyTimeToTrigger +00:00:05
# Runs the away branch in ~5s using the already-defined command; the
# *{sunset("REAL")} recurrence re-arms itself for the next real sunset
# afterward. Remember to `set SCN_Away off` again once done testing.
#
# Simulates occupancy with a realistic household evening: arrival at dusk,
# cooking while the kids play in their rooms, a downstairs toilet break,
# family dinner, living-room TV, kids' bath/bedtime routine, then the
# parents' own bedtime. Runs ~2h15 from sunset to lights-out.
#
# Shutter rule: a room's shutter is always brought to >=90% closed
# *before or at* the moment that room's light first turns on — an
# illuminated room behind a fully open shutter is an obvious "nobody's
# home" tell to an outside observer. Shutters may close further to 100%
# afterward once the room is done for the night. This is issued
# explicitly per room rather than relying on away_morning's carried-over
# position, since that automation may not have run (e.g. right after a
# startup default).
#
# Phase breakdown (offsets from sunset):
#   0:00-0:02   arrival: outside/hall lights, cellar C1/C3 fully close
#   0:02-0:24   cooking (kitchen shutters ->90% before kitchen light;
#               hannah/nicolas play in their rooms, shutters ->90% first;
#               downstairs wc break); office/wc/F2 hall shutters close
#               fully since unused the rest of the evening
#   0:24-1:03   dinner (dining shutter ->90% before light, ->100% once
#               seated); kitchen/dining lights off after cleanup
#   1:03-1:28   living-room TV (shutter ->90% before light, ->100% once
#               settled); first bathroom/shower use (shutter ->90% first)
#   1:28-1:44   kids' bedtime: teeth brushing, bathroom/hannah/nicolas
#               shutters fully close, bedtime-story lights off
#   2:05-2:14   parents' bedtime: final bathroom stop, bedroom shutter
#               ->90% before light, ->100% once settled, lights out
#
# Note: offsets are intentionally irregular (e.g. +00:01:42 not +00:02:00) so
# the presence simulation does not look mechanical from the outside.

define away_evening at *{sunset("REAL")} {\
	if ((ReadingsVal("SCN_Away", "state", "off")) eq "on") {\
		{Log 3, "automation-LOG: eve active."}\
		{fhem("define m1 at +00:00:15 set LGT_F1_outside on")}\
		{fhem("define m2 at +00:00:22 set LGT_F1_hall_door on")}\
		{fhem("define m3 at +00:00:25 set SHU_F0_C1 g1 100")}\
		{fhem("define m4 at +00:00:27 set SHU_F0_C3 g1 100")}\
		{fhem("define m5 at +00:00:35 set LGT_F1_hall_stairs on")}\
		{fhem("define m6 at +00:01:40 set LGT_F1_hall_stairs off")}\
		{fhem("define m7 at +00:02:05 set SHU_F1_kitchen_window g1 90")}\
		{fhem("define m8 at +00:02:08 set SHU_F1_kitchen_door g1 90")}\
		{fhem("define m9 at +00:02:10 set LGT_F1_hall_door off")}\
		{fhem("define m10 at +00:02:15 set LGT_F1_kitchen on")}\
		{fhem("define m11 at +00:03:20 set LGT_F1_kitchen_led on")}\
		{fhem("define m12 at +00:03:55 set SHU_F2_hannah g1 90")}\
		{fhem("define m13 at +00:04:00 set LGT_F2_hannah on")}\
		{fhem("define m14 at +00:06:10 set SHU_F2_nicolas g1 90")}\
		{fhem("define m15 at +00:06:15 set LGT_F2_nicolas on")}\
		{fhem("define m16 at +00:14:25 set SHU_F1_wc g1 90")}\
		{fhem("define m17 at +00:14:30 set LGT_F1_wc on")}\
		{fhem("define m18 at +00:16:50 set LGT_F1_wc off")}\
		{fhem("define m19 at +00:16:55 set SHU_F1_wc g1 100")}\
		{fhem("define m20 at +00:18:10 set SHU_F1_office g1 100")}\
